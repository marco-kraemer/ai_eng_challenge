<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#204e40">
  <title>Atendimento | Empório da Música</title>
  <link rel="stylesheet" href="/assets/chat.css">
  <script src="/assets/stream.js" defer></script>
  <script src="/assets/chat.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">♪</span><span class="brand-name">Empório<span>da música</span></span></div>
    <span class="location">Campo Grande, MS</span>
  </header>
  <main class="shell">
    <div class="toolbar">
      <span class="assistant"><span class="dot" aria-hidden="true"></span>Tom · Assistente virtual</span>
      <div class="toolbar-actions"><button class="quiet" id="order-shortcut" type="button">Meu pedido</button><button class="quiet" id="new" type="button">Nova conversa</button></div>
    </div>
    <section id="conversation" aria-label="Conversa com a Empório" tabindex="0">
      <div id="welcome">
        <h1>Como posso ajudar?</h1>
        <p class="intro">Escolha uma opção ou escreva sua pergunta.</p>
        <div class="entry-options">
          <button class="intent" type="button" data-intent="products"><span class="entry-icon" aria-hidden="true">♫</span><span><strong>Encontrar um instrumento</strong><small>Escolha o instrumento e seu orçamento.</small></span><span class="arrow" aria-hidden="true">→</span></button>
          <button class="intent" type="button" data-intent="order"><span class="entry-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v11l-9 4-9-4zM3 7l9 4 9-4m-9 4v11M7 5l10 4v5"/></svg></span><span><strong>Acompanhar meu pedido</strong><small>Consulte o status e a previsão de entrega.</small></span><span class="arrow" aria-hidden="true">→</span></button>
          <button class="intent" type="button" data-intent="purchase"><span class="entry-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0zM8 8a3 3 0 1 1 5 2c-1 0-2 1-2 2m0 3h.01"/></svg></span><span><strong>Dúvidas sobre minha compra</strong><small>Trocas, devoluções, entrega e pagamento.</small></span><span class="arrow" aria-hidden="true">→</span></button>
          <button class="intent" type="button" data-intent="store"><span class="entry-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 9 2-6h14l2 6M4 10v11h16V10M8 21v-7h5v7M3 9a3 3 0 0 0 5 2 3 3 0 0 0 5 0 3 3 0 0 0 5 0 3 3 0 0 0 3-2"/></svg></span><span><strong>Informações da loja</strong><small>Veja os horários, o endereço e os contatos.</small></span><span class="arrow" aria-hidden="true">→</span></button>
        </div>
      </div>
      <section id="picker" class="picker" aria-label="Escolha de instrumento ou dúvida" hidden></section>
      <div id="messages" aria-live="polite" aria-relevant="additions"></div>
    </section>
    <div class="composer">
      <div id="status" role="status" aria-atomic="true"></div>
      <form id="message-form"><input id="message-input" aria-label="Sua mensagem" placeholder="Escreva sua mensagem…" maxlength="2000" autocomplete="off" required><button class="send" type="submit">Enviar <span aria-hidden="true">↑</span></button></form>
    </div>
  </main>
</body>
</html>
