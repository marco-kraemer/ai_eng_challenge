<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empório da Música</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f1ec;color:#242620;font:17px system-ui}main{max-width:880px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:22px}header{border-bottom:1px solid #d7d8cf;padding-bottom:16px}h1{margin:0;font-size:25px}header p{margin:8px 0;color:#606355}#messages{flex:1;overflow:auto;padding:20px 0;display:flex;flex-direction:column;gap:14px}.message{padding:15px 18px;border-radius:16px;background:white;max-width:86%;white-space:pre-wrap}.user{align-self:flex-end;background:#264c3b;color:white}form{display:flex;gap:10px;padding-top:15px}input{min-width:0;flex:1;border:1px solid #b5bcaf;border-radius:12px;padding:15px;font:inherit}button{background:#264c3b;color:white;border:0;border-radius:12px;padding:12px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{min-height:24px;color:#606355}</style>
<main><header><h1>Empório da Música</h1><p>Encontre o instrumento para o seu próximo passo.</p></header><section id="messages" aria-label="Conversa" aria-live="polite"><div class="message">Olá! Que instrumento você está procurando?</div></section><div id="status" role="status"></div><form><input aria-label="Mensagem" placeholder="Escreva sua mensagem…" maxlength="2000" required><button>Enviar</button></form></main>
<script>const form=document.querySelector('form'),input=document.querySelector('input'),button=document.querySelector('button'),messages=document.querySelector('#messages'),status=document.querySelector('#status');function add(text,user=false){const item=document.createElement('div');item.className='message'+(user?' user':'');item.textContent=text;messages.append(item);messages.scrollTop=messages.scrollHeight}form.addEventListener('submit',async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;add(message,true);input.value='';button.disabled=true;status.textContent='Consultando…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await response.json();add(response.ok?data.message:'Atendimento indisponível no momento. Tente mais tarde.')}catch{add('Não foi possível conectar. Tente novamente.')}finally{button.disabled=false;status.textContent='';input.focus()}})</script></html>
